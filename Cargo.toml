[package]
name = "app_window"
version = "0.3.3"
edition = "2024"
authors = ["Drew Crawford <drew@sealedabstract.com>"]
description = "Cross-platform window library"
repository = "https://github.com/drewcrawford/app_window"
homepage = "https://sealedabstract.com/code/app_window"
license = "MPL-2.0"
keywords = ["window", "windowing", "input", "keyboard", "mouse"]
categories = ["gui", "os", "wasm", "asynchronous"]
exclude = [".*"]
rust-version = "1.88.0"

#[lib]

[features]
logwise_internal = []


[dependencies]
wasm_lite_std = { path = "../wasm_lite/crates/wasm_lite_std" }
atomic_float = "1.1.0"
raw-window-handle = "0.6.2"
logwise = "0.5.1"
thiserror = "2.0.17"
some_executor = "0.6.1"
continue = "0.1.1"
send_cells = "0.2.1"

[dev-dependencies]
# needed for gpu example
wgpu = "28.0.0"
test_executors = "0.4.1" # gpu example

# needed for submit_to_main_thread_benchmark
futures = "0.3"

# macos
[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = "1.0.7"



[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.7", features = ["build"] }

# wasm32
[target.'cfg(target_arch="wasm32")'.dependencies]
# Replaces web-sys/wasm-bindgen/wasm-bindgen-futures: the DOM surface this crate
# needs is `wasm_lite::dom`. No feature list, because the bindings are
# hand-written rather than generated per-interface.
wasm_lite = { path = "../wasm_lite/crates/wasm_lite" }
continue_stream = "0.1.0"

# `wasm_lite` is a real dependency now (above), so #[wasm_lite_test] needs no
# dev-dependency of its own. `console_error_panic_hook` is replaced by
# `wasm_lite::set_panic_hook`.


# windows

[target.'cfg(target_os="windows")'.dependencies]
windows = { version = "0.62.2", features=[
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# linux
[target.'cfg(target_os="linux")'.dependencies]
libc = "0.2.175"
wayland-client = "0.31.11"
wayland-backend = {version = "0.3.7", features=["client_system"]}
wayland-protocols = {version = "0.32.9", features = ["client"]}
wayland-cursor = "0.31.11"
memmap2 = "0.9.7"
io-uring = "0.7.9"
zune-png = "0.5.1"
# probably at some point this will be a global requirement,
# for now we only NEED it to advertise decorations on linux
accesskit = "0.24.0"
accesskit_unix = "0.20.0"
# input dependencies
tempfile = "3.21.0"
atspi = {version = "0.29.0", features=[]}


[[example]]
name = "gpu"

[[test]]
name = "executor_bug_test"
path = "tests/executor_bug_test.rs"
harness = false

[[test]]
name = "wasm_main_closure_execution_test"
path = "tests/wasm_main_closure_execution_test.rs"
harness = false

[[test]]
name = "submit_to_main_thread_benchmark"
path = "tests/submit_to_main_thread_benchmark.rs"
harness = false

[[test]]
name = "platform_coalesced_mouse_test"
path = "tests/platform_coalesced_mouse_test.rs"
harness = false
[[test]]
name = "platform_coalesced_keyboard_test"
path = "tests/platform_coalesced_keyboard_test.rs"
harness = false

[patch.crates-io]
# `continue_stream` is migrated to wasm_lite in its own checkout and still
# published against wasm_safe_thread; without this the published version walks
# wasm-bindgen back into the wasm32 graph and the runner refuses the test module.
continue_stream = { path = "../continue_stream" }
# Likewise `send_cells`: this crate uses it for `SendCell<HWND>` on Win32 and it
# is migrated locally, but the published 0.2.2 still depends on wasm_safe_thread.
send_cells = { path = "../send_cells" }
# Dev-cycle self-patch (NEEDS_REVIEW §32): the published test_executors expands
# #[async_test] to #[wasm_bindgen_test], so the wasm32 test target does not
# compile here without this. The rest come along because the Instant flag-day is
# all-or-nothing and the registry copies still pull wasm_safe_thread back in.
test_executors = { path = "../test_executors" }
logwise = { path = "../logwise" }
some_executor = { path = "../some_executor" }
continue = { path = "../continue" }
