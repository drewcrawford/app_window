[net]
# The temporary pre-release logwise/some_executor pins are Gitea SSH URLs.
git-fetch-with-cli = true

[unstable]
# Tell *Cargo* to rebuild these crates for non-host targets (needs nightly)
build-std = ["std", "panic_abort"]

[target.'cfg(target_arch="wasm32")']
# The wasm_lite runner. This crate's DOM surface is `wasm_lite::dom` now, so the
# test binary is no longer a wasm-bindgen interop module (which the runner
# refuses). `wgpu` still is one — it is on the shim track, not this one — which
# is why the `gpu` example is not run this way.
runner = ["wasm_lite", "run"]

# The two wasm-bindgen workarounds that used to be here left with it:
# `--export=__heap_base` (its threading pass injected thread ids) and
# `-Csymbol-mangling-version=legacy` (its duplicate-declaration bug, #4820).
rustflags = [
    "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
    "-C", "link-arg=--shared-memory",
    "-C", "link-arg=--max-memory=1073741824",
    "-C", "link-arg=--import-memory",
    "-C", "link-arg=--export=__stack_pointer",
    "-C", "link-arg=--export=__wasm_init_tls",
    "-C", "link-arg=--export=__tls_size",
    "-C", "link-arg=--export=__tls_align",
    "-C", "link-arg=--export=__tls_base",
]

# cfg() predicates do not apply to rustdoc flags, so doctests need the exact
# triple to get the same shared-memory build.
[target.wasm32-unknown-unknown]
rustdocflags = [
    "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
    "-C", "link-arg=--shared-memory",
    "-C", "link-arg=--max-memory=1073741824",
    "-C", "link-arg=--import-memory",
    "-C", "link-arg=--export=__stack_pointer",
    "-C", "link-arg=--export=__wasm_init_tls",
    "-C", "link-arg=--export=__tls_size",
    "-C", "link-arg=--export=__tls_align",
    "-C", "link-arg=--export=__tls_base",
]

[target.'cfg(test)']
runner = "test_runner"
